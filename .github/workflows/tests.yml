# tests.yml — the merge gate: the package test suite on macOS, the platform the
# pollers and LaunchAgents run on.
#
# This workflow is deliberately the ONLY check a pull request carries. The PR
# watcher (pr-watch.sh) reads the PR's check rollup, and it never merges on a
# red or pending rollup: a job-level `continue-on-error` does NOT make a failing
# job report success to the checks API (the job's own conclusion stays
# `failure`, only the workflow run is spared), and a slow advisory job keeps the
# rollup PENDING for as long as it runs. Either would park every PR in WAIT_CI.
# The portability runs (Windows, Ubuntu) therefore live in portability.yml,
# which runs on main and on demand and never enters a PR's rollup.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests (macos-latest)
    runs-on: macos-latest
    # A wedged test must not hold the rollup for the default six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Some tests build repositories on top of this checkout's history.
          fetch-depth: 0

      - name: Install coreutils
        # The runner image ships without GNU coreutils, so `gtimeout` is absent
        # and the implementer-timeout path (rc 124 -> exit 7) would be SKIPped
        # rather than tested. README section 2 lists coreutils as the optional
        # dependency that gives claude calls a time cap; CI installs it so that
        # path is exercised on every run.
        run: brew install coreutils

      - name: Configure git
        # The runners ship without an identity, and without an explicit default
        # branch `git init` would produce `master` — the suite's temporary
        # repositories assume the same default a development machine has.
        run: |
          git config --global init.defaultBranch main
          git config --global user.name  "ci"
          git config --global user.email "ci@example.invalid"

      - name: Show toolchain
        run: |
          bash --version | head -1
          git --version
          jq --version || echo "jq: not available"
          gtimeout --version | head -1 || echo "gtimeout: not available"

      - name: Run the test suite
        run: bash tests/run-all.sh
