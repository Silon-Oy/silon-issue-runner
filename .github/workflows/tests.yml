# tests.yml — the merge gate: the package test suite on the platforms that are
# supported, meaning the ones a regression is allowed to stop a merge on.
#
# macOS is where the pollers and the LaunchAgents run. Windows is where the
# INTERACTIVE path runs — Claude Code driving the package's scripts through Git
# Bash, with no poller, no launchd and no cockpit (epic #211).
#
# WHERE EACH PLATFORM RUNS, AND WHY IT DIFFERS. Actions minutes are billed in
# this private repository and are free in the public mirror
# (Silon-Oy/silon-issue-runner) — measured, not assumed: every mirror line item
# bills gross and discounts the same amount to a zero net, on Linux, Windows and
# macOS alike. The multipliers make that gap large: macOS costs 10.3x a Linux
# minute and Windows 1.67x, and in one nine-day stretch this workflow alone
# spent 1416 billed minutes here — two thirds of the organisation's entire
# Actions spend, which it then exhausted.
#
# So the two platforms are treated by how much a late signal costs:
#
#   - macOS stays a PR gate. Its regressions land unattended — the pollers and
#     LaunchAgents run there, and this repository merges its own PRs without a
#     human (pr-watch.sh), so nothing else would notice a break before the tool
#     that produces the fixes is the thing that is broken.
#   - Windows runs in the public mirror only. The interactive path has a person
#     present by definition, so a signal that arrives at release time is still
#     in time; it is also the slow job (median 16 minutes against macOS's 3).
#
# The `if:` conditions below are what make one file behave differently in the
# two repositories — the mirror is a copy of this tree, so a trigger-level split
# would be copied along with it. THE MIRROR IS NAMED IN THOSE CONDITIONS: if it
# is ever renamed or replaced, Windows silently stops running everywhere, and
# the condition is the only place that says so.
#
# EVERY JOB IN THIS FILE MUST BE A REAL GATE. The PR watcher (pr-watch.sh) reads
# the PR's check rollup and never merges on a red or pending rollup: a job-level
# `continue-on-error` does NOT make a failing job report success to the checks
# API (the job's own conclusion stays `failure`, only the workflow run is
# spared), and a slow advisory job keeps the rollup PENDING for as long as it
# runs. Either would park every PR in WAIT_CI. An advisory platform therefore
# belongs in portability.yml, which never enters a PR's rollup — that is where
# Ubuntu still is.
name: tests

on:
  pull_request:
  push:
    branches: [main]

# A PR branch that is pushed again supersedes its own in-flight run; without
# this both platforms ran to completion on every intermediate commit. Pushes to
# main are never cancelled — in the mirror that is the release run, and its
# result is the record that the released tree passed.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macos:
    name: tests (macos-latest)
    runs-on: macos-latest
    # The PR gate here; in the mirror it also runs on the release push. What it
    # does not do is run twice for the same commit in this repository: a merge
    # to main used to re-run the gate the PR had just passed, which was 32 of
    # this workflow's 75 runs in the stretch measured above.
    if: >-
      github.event_name == 'pull_request'
      || github.repository == 'Silon-Oy/silon-issue-runner'
    # A wedged test must not hold the rollup for the default six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Some tests build repositories on top of this checkout's history.
          fetch-depth: 0

      - name: Install coreutils
        # The runner image ships without GNU coreutils, so `gtimeout` is absent
        # and the implementer-timeout path (rc 124 -> exit 7) would be SKIPped
        # rather than tested. README section 2 lists coreutils as the optional
        # dependency that gives claude calls a time cap; CI installs it so that
        # path is exercised on every run.
        run: brew install coreutils

      - name: Configure git
        # The runners ship without an identity, and without an explicit default
        # branch `git init` would produce `master` — the suite's temporary
        # repositories assume the same default a development machine has.
        run: |
          git config --global init.defaultBranch main
          git config --global user.name  "ci"
          git config --global user.email "ci@example.invalid"

      - name: Show toolchain
        run: |
          bash --version | head -1
          git --version
          jq --version || echo "jq: not available"
          gtimeout --version | head -1 || echo "gtimeout: not available"

      - name: Run the test suite
        run: bash tests/run-all.sh

  windows:
    name: tests (windows-latest)
    runs-on: windows-latest
    # Mirror only — see the header. A skipped job is not a hole in the gate as
    # far as the watcher is concerned: pr_ci_state (lib/pr-watch-lib.sh) counts
    # SKIPPED alongside SUCCESS and NEUTRAL, so this reports OK in a PR rollup
    # here and is a real gate on the released tree in the mirror.
    if: github.repository == 'Silon-Oy/silon-issue-runner'
    # Git Bash spawns processes far slower than macOS; the suite takes several
    # times its macOS duration here. The cap keeps a wedged run from burning
    # hours, not from finishing.
    timeout-minutes: 45
    defaults:
      run:
        # Selects Git Bash, which is the shell Claude Code's Bash tool uses on
        # Windows — the interactive path this job is the gate for.
        shell: bash
    env:
      # Make `ln -s` create real symlinks instead of file copies, so the
      # installer tests exercise the ownership predicate they are written
      # against. README section 3.2 asks a Windows user for the same setting.
      MSYS: winsymlinks:nativestrict
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global init.defaultBranch main
          git config --global user.name  "ci"
          git config --global user.email "ci@example.invalid"

      - name: Show toolchain
        run: |
          uname -s
          bash --version | head -1
          git --version
          jq --version || echo "jq: not available"
          jq -b -n 1 >/dev/null 2>&1 && echo "jq: --binary supported" || echo "jq: NO --binary (jq < 1.7)"
          timeout --version 2>/dev/null | head -1 || echo "timeout: not available or not GNU"

      - name: Run the test suite
        run: bash tests/run-all.sh
