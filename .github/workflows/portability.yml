# portability.yml — the test suite on a platform that is measured, not gated.
#
# Measurement, not a gate: it runs on main and on demand, never on a pull
# request, so its result never enters a PR's check rollup (see tests.yml for why
# that matters to the PR watcher). Read the results in the Actions tab.
#
# Ubuntu is here because the package is USED on Linux run-boxes (README section
# 3.1) but that path has never been run through end to end, so a red row is a
# finding rather than a regression. Windows left this file when it went green:
# a platform that is meant to stay green belongs in tests.yml as a required job,
# and moving it there is the only way a regression on it can stop a merge.
name: portability

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global init.defaultBranch main
          git config --global user.name  "ci"
          git config --global user.email "ci@example.invalid"

      - name: Show toolchain
        run: |
          uname -s
          bash --version | head -1
          git --version
          jq --version || echo "jq: not available"
          timeout --version 2>/dev/null | head -1 || echo "timeout: not available or not GNU"

      - name: Run the test suite
        run: bash tests/run-all.sh
